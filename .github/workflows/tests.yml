name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-independent test dependencies
        run: python -m pip install fastapi uvicorn python-multipart psutil Pillow pypdfium2 httpx
      - name: Run unit and HTTP tests without models or GPU
        run: python -B -m unittest discover -s tests -v
